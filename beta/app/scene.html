<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>直播场景 · OBS 采集</title>
<style>
:root{
  --w:1920; --h:1080;
  --ink:#f2f4ff;
  --mint:#5ee6c0;
  --gold:#ffcb6b;
  --dim:#8f9ab5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05060a;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}

#stage{
  position:absolute;left:50%;top:50%;
  width:1920px;height:1080px;
  transform-origin:center center;
  background:
    radial-gradient(900px 700px at 22% 18%, #2a2350 0%, transparent 62%),
    radial-gradient(1100px 800px at 82% 78%, #14364a 0%, transparent 60%),
    radial-gradient(700px 600px at 62% 12%, #3a2a55 0%, transparent 65%),
    linear-gradient(160deg,#0d0b18 0%,#0a0d16 55%,#080a10 100%);
  overflow:hidden;
}
  /* 舞台背景：图片层 / 暗化层 */
  .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:0;transition:opacity .35s;z-index:0}
  .bgdim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:1}

#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>")}

/* 地面光 */
.floor{position:absolute;left:50%;bottom:-160px;width:1400px;height:420px;transform:translateX(-50%);
  background:radial-gradient(50% 50% at 50% 50%, rgba(120,90,255,.30), transparent 70%);filter:blur(20px)}

/* ── 模型区（正面立绘，像素风） ── */
  #djBooth{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;transition:opacity .6s ease}
  #djBooth.on{opacity:1}
  #djBooth .dj-venue{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(120,20,60,.55),transparent 55%),radial-gradient(ellipse at 20% 60%,rgba(30,60,160,.5),transparent 55%),radial-gradient(ellipse at 85% 55%,rgba(140,20,90,.45),transparent 55%),linear-gradient(180deg,#05030a 0%,#0a0512 55%,#05030a 100%)}
  #djBooth .dj-venue::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(0,0,0,.75) 100%)}
  #djBooth .dj-floor{position:absolute;left:-18%;right:-18%;bottom:-40px;height:46%;z-index:1;background:repeating-linear-gradient(90deg,rgba(255,45,85,.24) 0 2px,transparent 2px 64px),repeating-linear-gradient(0deg,rgba(47,123,255,.2) 0 2px,transparent 2px 54px);transform:perspective(420px) rotateX(64deg);transform-origin:bottom center;animation:djFloor 1.8s linear infinite;mask-image:linear-gradient(transparent 2%,#000 45%);pointer-events:none}
  @keyframes djFloor{to{background-position:0 54px,0 54px}}
  #djBooth .dj-flash{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.18),rgba(255,45,85,.10) 45%,transparent 70%);opacity:0;transition:opacity .08s linear}
  #djBooth .dj-frame{position:absolute;bottom:250px;width:0;height:0;z-index:4;border-left:64px solid transparent;border-right:64px solid transparent;border-bottom:150px solid rgba(255,45,85,.28);filter:drop-shadow(0 0 20px rgba(255,45,85,.8));animation:djFrame 1.6s ease-in-out infinite alternate}
  #djBooth .dj-frame.l{left:calc(50% - 330px)}
  #djBooth .dj-frame.r{right:calc(50% - 330px);border-bottom-color:rgba(47,123,255,.28);filter:drop-shadow(0 0 20px rgba(47,123,255,.8));animation-delay:-.8s}
  @keyframes djFrame{from{opacity:.35;transform:scaleY(.85)}to{opacity:.95;transform:scaleY(1.05)}}
  #djBooth .dj-frontled{position:absolute;left:26px;right:26px;bottom:26px;height:46px;display:flex;align-items:flex-end;gap:4px;z-index:2;opacity:.9}
  #djBooth .dj-frontled b{flex:1;background:linear-gradient(180deg,#ff2d55,#2f7bff);border-radius:2px 2px 0 0;box-shadow:0 0 8px rgba(255,45,85,.6);animation:djFront 0.8s ease-in-out infinite alternate}
  #djBooth .dj-frontled b:nth-child(2n){animation-duration:.55s;animation-delay:-.2s}
  #djBooth .dj-frontled b:nth-child(3n){animation-duration:1.1s;animation-delay:-.4s}
  @keyframes djFront{from{height:14%}to{height:100%}}
  #djBooth.beat .dj-ledwall{filter:brightness(1.25) saturate(1.2)}
  #djBooth.beat #djCover{transform:scale(1.04);filter:saturate(1.4) brightness(1.15)}
  #djBooth #djCover{transition:transform .18s ease,filter .18s ease}
  #djLaserCanvas{position:absolute;left:-12%;top:-14%;width:124%;height:128%;z-index:1;pointer-events:none;mix-blend-mode:screen}
  #djBooth .dj-rig{position:absolute;left:0;right:0;top:0;height:120px;z-index:3;background:linear-gradient(180deg,rgba(8,5,14,.95),rgba(8,5,14,.35) 70%,transparent);border-bottom:1px solid rgba(255,60,120,.25);box-shadow:0 0 40px rgba(255,40,100,.25)}
  #djBooth .dj-rig::before{content:"";position:absolute;left:6%;right:6%;top:22px;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 2px,transparent 2px 26px);opacity:.6}
  #djBooth .dj-array{position:absolute;top:54px;width:120px;height:430px;z-index:4;display:flex;flex-direction:column;gap:6px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.7))}
  #djBooth .dj-array.l{left:38px;transform:perspective(600px) rotateY(12deg)}
  #djBooth .dj-array.r{right:38px;transform:perspective(600px) rotateY(-12deg)}
  #djBooth .dj-array i{flex:1;border-radius:6px;background:linear-gradient(180deg,#16101f,#07050b);border:1px solid rgba(255,70,120,.25);position:relative;box-shadow:inset 0 0 18px #000}
  #djBooth .dj-array i::before,#djBooth .dj-array i::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a2038,#050308 72%);border:1px solid rgba(255,80,130,.25)}
  #djBooth .dj-array i::before{top:9px;width:64px;height:64px}
  #djBooth .dj-array i::after{bottom:9px;width:44px;height:44px}
  #djBooth .dj-ledwall{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);width:660px;height:260px;z-index:3;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);background:linear-gradient(180deg,#1a0a14,#0a0510);border-top:2px solid rgba(255,70,120,.7);box-shadow:0 0 60px rgba(255,30,90,.35)}
  #djBooth .dj-ledwall .dj-tri{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:150px solid rgba(255,45,85,.55);filter:drop-shadow(0 0 22px rgba(255,45,85,.9))}
  #djBooth .dj-ledwall .dj-tri.t2{top:38px;border-left-width:70px;border-right-width:70px;border-bottom-width:110px;border-bottom-color:rgba(70,120,255,.6);filter:drop-shadow(0 0 22px rgba(70,120,255,.9))}
  #djBooth .dj-ledwall b{position:absolute;left:0;right:0;bottom:22px;text-align:center;font:900 34px/1 ui-monospace,Consolas,monospace;letter-spacing:8px;color:#fff;text-shadow:0 0 10px #ff2d55,0 0 26px #ff2d55,0 0 50px #2f7bff}
  #djBooth .dj-sign{position:absolute;left:50%;top:52px;transform:translateX(-50%);font:900 26px/1 ui-monospace,Consolas,monospace;letter-spacing:8px;color:#fff;text-shadow:0 0 8px #ff2d55,0 0 24px #ff2d55,0 0 46px #2f7bff;white-space:nowrap;z-index:5}
  #djBooth .dj-riser{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:840px;height:190px;z-index:5;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);background:linear-gradient(180deg,#1e1020 0%,#120a18 48%,#07040a 100%);border-top:2px solid rgba(255,70,120,.6);box-shadow:0 -8px 50px rgba(255,40,100,.35)}
  #djBooth .dj-riser span{position:absolute;left:50%;top:52px;transform:translateX(-50%);font:900 36px/1 ui-monospace,Consolas,monospace;letter-spacing:12px;color:rgba(255,235,245,.92);text-shadow:0 0 10px #ff2d55,0 0 30px #ff2d55,0 0 60px #2f7bff}
  #stage > .dj-desk{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);width:620px;height:150px;z-index:8;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#251626,#0d0712 75%);border:1px solid rgba(255,70,120,.45);box-shadow:0 -6px 46px rgba(255,45,85,.35)}
  #stage > .dj-desk .dj-platter{position:absolute;top:-46px;width:140px;height:140px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,#18101f 0 2px,#0a060d 2px 4px);border:3px solid #2b2038;box-shadow:0 0 0 4px rgba(255,45,85,.18),0 10px 22px rgba(0,0,0,.6)}
  #stage > .dj-desk .dj-platter.l{left:56px}
  #stage > .dj-desk .dj-platter.r{right:56px}
  #stage > .dj-desk .dj-platter span{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:radial-gradient(circle,#ff2d55,#2f7bff);box-shadow:0 0 16px rgba(255,45,85,.9)}
  #stage > .dj-desk .dj-platter::after{content:"";position:absolute;left:50%;top:8px;width:2px;height:48px;margin-left:-1px;background:linear-gradient(#ff6b8a,transparent);transform-origin:bottom center}
  #stage > .dj-desk .dj-mixer{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:190px;height:70px;border-radius:8px;background:#08050c;border:1px solid rgba(255,70,120,.35);display:flex;align-items:center;justify-content:center;gap:10px}
  #djBooth .dj-mixer b{width:7px;height:34px;border-radius:4px;background:linear-gradient(#ff2d55,#2f7bff);box-shadow:0 0 10px rgba(255,45,85,.7)}
  #stage > .dj-desk .dj-led{position:absolute;left:8px;right:8px;bottom:8px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#ff2d55 0 10px,#2f7bff 10px 20px,#fff 20px 24px);filter:blur(.4px);opacity:.85;animation:djLed 1s linear infinite}
  @keyframes djLed{0%,100%{opacity:.5}50%{opacity:1}}
  #djBooth .dj-crowd{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:1500px;height:190px;z-index:9;pointer-events:none}
  #djBooth .dj-crowd i{position:absolute;bottom:0;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#22162c,#020104 72%);box-shadow:0 -4px 22px rgba(0,0,0,.9),0 -1px 0 rgba(255,70,130,.45),0 0 18px rgba(255,45,85,.18)}
  #djBooth .dj-crowd i::before{content:"";position:absolute;left:50%;bottom:60px;width:9px;height:86px;background:#05030a;border-radius:5px;transform-origin:bottom center}
  #djBooth .dj-crowd i::after{content:"";position:absolute;left:50%;bottom:138px;width:20px;height:20px;border-radius:50%;background:#07040c;box-shadow:0 0 14px rgba(255,45,85,.35)}
  #djBooth .dj-crowd i:nth-child(1){left:1%;width:92px;height:92px}
  #djBooth .dj-crowd i:nth-child(2){left:10%;height:70px;width:70px}
  #djBooth .dj-crowd i:nth-child(3){left:20%;width:96px;height:96px}
  #djBooth .dj-crowd i:nth-child(4){left:31%;height:74px;width:74px}
  #djBooth .dj-crowd i:nth-child(5){left:42%;width:90px;height:90px}
  #djBooth .dj-crowd i:nth-child(6){left:54%;height:72px;width:72px}
  #djBooth .dj-crowd i:nth-child(7){left:64%;width:94px;height:94px}
  #djBooth .dj-crowd i:nth-child(8){left:76%;height:68px;width:68px}
  #djBooth .dj-crowd i:nth-child(9){left:86%;width:88px;height:88px}
  #djBooth .dj-crowd i:nth-child(10){left:95%;height:76px;width:76px}
  #djBooth .dj-strobe{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.25),transparent 55%);opacity:0;z-index:8;pointer-events:none}
  #djBooth.on .dj-strobe{animation:djStrobe 2.6s ease-in-out infinite}
  @keyframes djStrobe{0%,70%,100%{opacity:0}74%{opacity:.9}78%{opacity:0}82%{opacity:.55}86%{opacity:0}}
  #stage.dj > .dj-desk .dj-platter{animation:djSpin 2.4s linear infinite}
  #stage.dj > .dj-desk .dj-platter.r{animation-duration:2s;animation-direction:reverse}
  @keyframes djSpin{to{transform:rotate(360deg)}}
  #djBooth.on .dj-array i::before{animation:djPump .5s ease-in-out infinite alternate}
  @keyframes djPump{from{box-shadow:inset 0 0 18px #000}to{box-shadow:inset 0 0 20px #ff2d55,0 0 12px rgba(255,45,85,.5)}}
  #djBooth .dj-ledwall{overflow:hidden}
  #djBooth #djCover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.92;filter:saturate(1.15) contrast(1.05)}
  #djBooth .dj-ledwall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55) 65%,rgba(0,0,0,.85));box-shadow:inset 0 0 60px rgba(255,45,85,.35)}
  #djBooth .dj-eq{position:absolute;left:24px;right:24px;bottom:34px;height:54px;display:flex;align-items:flex-end;gap:5px;z-index:2;opacity:.9;mix-blend-mode:screen}
  #djBooth .dj-eq b{flex:1;height:30%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#7fd4ff,#ff2d55);box-shadow:0 0 10px rgba(255,45,85,.6);animation:djEq 1s ease-in-out infinite alternate}
  #djBooth .dj-eq b:nth-child(2n){animation-duration:.72s;animation-delay:-.2s}
  #djBooth .dj-eq b:nth-child(3n){animation-duration:1.35s;animation-delay:-.5s}
  #djBooth .dj-eq b:nth-child(5n){animation-duration:.55s;animation-delay:-.32s}
  @keyframes djEq{from{height:12%}to{height:96%}}
  #djBooth .dj-ledlabel{position:absolute;left:0;right:0;top:16px;text-align:center;font:900 20px/1 ui-monospace,Consolas,monospace;letter-spacing:6px;color:#fff;text-shadow:0 0 8px #ff2d55,0 0 24px #2f7bff;z-index:2;opacity:.9}
  #djBooth .dj-song{position:absolute;left:50%;top:92px;transform:translateX(-50%);max-width:70%;z-index:9;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 18px rgba(255,45,85,.55)}
  #djBooth .dj-song b{display:block;font:900 26px/1.2 "Microsoft YaHei",sans-serif;color:#fff;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #djBooth .dj-song span{display:block;margin-top:4px;font-size:13px;color:rgba(255,220,235,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #djBooth .dj-smoke{position:absolute;bottom:96px;width:180px;height:520px;z-index:3;pointer-events:none;opacity:.55;filter:blur(18px)}
  #djBooth .dj-smoke.l{left:-30px}
  #djBooth .dj-smoke.r{right:-30px;transform:scaleX(-1)}
  #djBooth .dj-smoke i{position:absolute;bottom:0;left:50%;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(220,225,255,.5),rgba(160,180,255,.15) 55%,transparent 72%);animation:djSmoke 5s ease-in-out infinite}
  #djBooth .dj-smoke i:nth-child(2){animation-delay:-1.7s;animation-duration:6.2s}
  #djBooth .dj-smoke i:nth-child(3){animation-delay:-3.1s;animation-duration:4.4s}
  @keyframes djSmoke{0%{transform:translate(-50%,0) scale(.55);opacity:.15}45%{opacity:.6}100%{transform:translate(-50%,-330px) scale(1.8);opacity:0}}
  #djBooth .dj-smoke.burst{opacity:1;filter:blur(12px)}
  #stage.dj > .dj-desk{transition:transform .16s ease,box-shadow .16s ease}
  #stage.dj > .dj-desk.beat{transform:translateX(-50%) translateY(-7px) rotate(-1.2deg);box-shadow:0 -10px 60px rgba(255,45,85,.65)}
  #djBooth .dj-ledwall{transition:filter .16s ease,transform .16s ease}
  #djBooth .dj-ledwall.glitch{animation:djGlitch .55s steps(3) both}
  @keyframes djGlitch{0%{filter:hue-rotate(0) saturate(1.6);transform:skewX(0)}20%{transform:skewX(3deg) translateX(6px);filter:hue-rotate(40deg) saturate(2)}40%{transform:skewX(-4deg) translateX(-8px);filter:hue-rotate(-30deg)}60%{transform:skewX(2deg) translateX(4px);filter:hue-rotate(70deg) saturate(2.2)}100%{transform:skewX(0);filter:none}}
  #stage:not(.dj) > .dj-desk{display:none}
  #stage > .dj-desk{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);width:620px;height:150px;z-index:8}
  #stage.dj .pet{bottom:190px !important;z-index:7 !important;transform:translateX(-50%) scale(.86);transform-origin:bottom center;transition:bottom .5s ease,transform .5s ease}
  #stage.v #djBooth .dj-desk{bottom:210px}
  #stage.video #djBooth,#stage.game #djBooth{display:none}
.pet{position:absolute;left:50%;bottom:206px;transform:translateX(-50%);width:440px;height:600px;
  display:flex;align-items:flex-end;justify-content:center}
  .grooveFx{position:absolute;inset:0;pointer-events:none;display:none;z-index:3}
  .pet.groove .grooveFx{display:block}
  .pet.groove{animation:grooveSway 1.6s ease-in-out infinite}
  @keyframes grooveSway{0%,100%{transform:translateX(-50%) rotate(-2.2deg)}50%{transform:translateX(-50%) rotate(2.2deg)}}
  #stage.dj .pet.groove{animation:none}
  .grooveFx .glasses{position:absolute;left:50%;top:37%;width:118px;height:40px;transform:translateX(-50%) rotate(-2deg);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
  .grooveFx .glasses::before,.grooveFx .glasses::after{content:"";position:absolute;top:6px;width:44px;height:26px;border-radius:8px 8px 12px 12px;background:linear-gradient(160deg,#1a1622,#05040a 65%);border:3px solid #2c2438;box-shadow:inset 6px 4px 0 rgba(127,212,255,.35),0 0 10px rgba(168,85,247,.35)}
  .grooveFx .glasses::before{left:0}
  .grooveFx .glasses::after{right:0}
  .grooveFx .hand{display:none;position:absolute;top:43%;width:22px;height:62px;z-index:5;border-radius:14px;background:linear-gradient(180deg,#f2d6c8,#d9b49f 72%,#2a2038 73%);border:2px solid #3a2c52;box-shadow:inset 0 0 8px rgba(0,0,0,.6),0 0 12px rgba(168,85,247,.25);transform-origin:bottom center}
  .grooveFx .hand::after{content:"";position:absolute;left:50%;top:-9px;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;background:#f2d6c8;border:2px solid #3a2c52}
  .grooveFx .hand.l{left:6px;animation:waveL .9s ease-in-out infinite}
  .grooveFx .hand.r{right:6px;animation:waveR .9s ease-in-out infinite}
  @keyframes waveL{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(24deg)}}
  @keyframes waveR{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-24deg)}}
  #stage.video .grooveFx,#stage.game .grooveFx{display:none !important}
.pet .halo{position:absolute;left:50%;bottom:40px;width:420px;height:420px;transform:translateX(-50%);
  border-radius:99px;background:radial-gradient(50% 50% at 50% 50%, rgba(150,110,255,.28), transparent 70%);
  filter:blur(12px);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{opacity:.7;transform:translateX(-50%) scale(1.07)}}

  .actcanvas{display:none;height:calc(var(--fig-h,520px) * 1.65);width:auto;image-rendering:pixelated;border-radius:6px}
  .pet.action .fig,.pet.action .figvid,.pet.action .grooveFx{display:none !important}
  .figvid{display:none;height:var(--fig-h,520px);width:auto;object-fit:contain;image-rendering:auto;border-radius:6px}
  #stage.v .figvid{height:var(--fig-hp,700px)}
.fig{position:relative;display:block;height:var(--fig-h,520px);width:auto;image-rendering:auto;
  filter:
    drop-shadow(1.2px 0 0 rgba(12,9,20,.9)) drop-shadow(-1.2px 0 0 rgba(12,9,20,.9))
    drop-shadow(0 1.2px 0 rgba(12,9,20,.9)) drop-shadow(0 -1.2px 0 rgba(12,9,20,.9))
    drop-shadow(0 22px 46px rgba(70,30,150,.5));
  animation:bob 4.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.fig.talking{animation:talkpulse .3s infinite alternate}
@keyframes talkpulse{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.014)}}

/* ── 视频层（B站点播：视频居中，立绘让到右下）── */
#vidLayer{position:absolute;left:50%;top:46%;width:1200px;height:675px;transform:translate(-50%,-50%) scale(.96);
  border-radius:26px;overflow:hidden;background:#000;opacity:0;pointer-events:none;z-index:6;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 60px 120px -60px #000, inset 0 0 0 1px rgba(255,255,255,.05);
  transition:opacity .3s ease, transform .3s ease}
#vidLayer.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#vid{width:100%;height:100%;display:block;object-fit:contain;background:#000}
#stage.video .pet{left:auto;right:96px;bottom:118px;width:300px;height:410px;transform:none;
  border-radius:24px;overflow:hidden;

    document.getElementById('sArtist').textContent = '发「点歌 歌名」点一首';
    setCover('');
    document.getElementById('sBar').style.width = '0%';
    document.getElementById('sCur').textContent = '0:00';
    document.getElementById('sDur').textContent = '0:00';
    renderQueue(d.queue || []);
    if (sg) { try { sg.pause(); sg.removeAttribute('src'); } catch (e) {} }
    try { vizStop(); } catch (e) { /* ignore */ }
      try { sg.volume = 0.9; } catch (e) {} songDucked = false;
      try { sg.muted = false; } catch (e) {}
      try { sg.volume = SONG_VOL || 0.9; } catch (e) {}
    curUrl = '';
    return;
  }

  document.getElementById('sName').textContent = p.name || '';
  var sub = p.artist ? p.artist : '';
  if (p.user) sub = (sub ? sub + ' · ' : '') + '由 ' + p.user + ' 点播';
  document.getElementById('sArtist').textContent = sub;
  setCover(p.cover || '');

  songStart = p.at || Date.now();
  songDur = p.duration || d.duration || 180000;
  document.getElementById('sDur').textContent = fmt(songDur);
  renderQueue(d.queue || []);

  if (p.url && sg) {
    if (curUrl !== p.url) {
      curUrl = p.url;
      try { sg.dataset.songName = p.name || ''; } catch (e) {}
      sg.src = p.url;
      sg.volume = 0.9;
      var pr = sg.play();
      try { viz.mode = ''; vizStart(); } catch (e) { /* ignore */ }
      if (pr && pr.catch) pr.catch(function(){
        wrap.classList.remove('playing');
        document.getElementById('sArtist').textContent = (sub ? sub + ' · ' : '') + '点击画面播放';
        // 自动播放被拦：按歌曲时长先把队列推进，避免整条卡住
        if (songDur) {
          if (songFallbackTimer) clearTimeout(songFallbackTimer);
          songFallbackTimer = setTimeout(function(){
            fetch('/api/song/next', { method: 'POST' }).catch(function(){});
          }, songDur + 5000);
        }
      });
    }
    if (songFallbackTimer) { clearTimeout(songFallbackTimer); songFallbackTimer = null; }
    wrap.classList.add('playing');
  } else {
    wrap.classList.remove('playing');
  }
  renderQueue(d.queue || []);
}

// ── 出声：用系统自带语音合成（免装引擎，设置里的语速/音调/静音时段立刻生效）──
var ttsVoices = [];
function loadVoices(){
  try { ttsVoices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) { ttsVoices = []; }
}
if (window.speechSynthesis) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
// 朗读队列：一句没念完不会被打断，新来的排队等着。
// 每句结束上报服务端，服务端才放下一句出来。
var speakQueue = [];
var speaking = false;

  // 预览窗口（场景窗口 / 独立窗口）不出声，声音只从 OBS 浏览器源走
  var FORCE_MUTE = /[?&]mute=1/.test(location.search);
  var IS_OBS = /[?&]src=obs/.test(location.search);
  var WANT_SPEAK = /[?&]speaker=1/.test(location.search);
  var MUTE = !(IS_OBS || WANT_SPEAK) || FORCE_MUTE;
  if (window.self !== window.top) MUTE = true;   // 设置页里的预览 iframe 不出声

function reportSpeech(type, id){
  try {
    fetch('/api/speech-event', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ type: type, id: id || null })
    }).catch(function(){});
  } catch (e) { /* 上报失败不影响念 */ }
}

// 服务端语音：优先拿音频文件来播，失败再退回浏览器朗读
var ttsAudio = null;
  // 视频在放时把她的语音压低，别盖住视频声音
  // 她说话时把音乐压低（不是停掉），说完恢复
  var SONG_VOL = 0.9;
  var songDucked = false;
  function duckSong() {
    if (!sg || sg.paused || !sg.currentSrc) return;
    try { sg.volume = Math.min(SONG_VOL, 0.35); songDucked = true; } catch (e) {}
  }
  function unduckSong() {
    if (!songDucked) return;
    songDucked = false;
    // 视频还在放就留在低位，避免和视频声打架
    try { sg.volume = vidPlaying ? 0.35 : SONG_VOL; } catch (e) {}
  }

  function speechVolume(){ return vidPlaying ? 0.35 : 1; }

function playServerTts(sp, onDone){
  var ac = new AbortController();
  var timer = setTimeout(function(){ try { ac.abort(); } catch (e) {} }, 15000);
  fetch('/api/tts/speak', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: sp.text }),
    signal: ac.signal
  }).then(function(r){
    if (!r.ok) throw new Error('tts ' + r.status);
    return r.blob();
  }).then(function(blob){
    clearTimeout(timer);
    var url = URL.createObjectURL(blob);
    if (ttsAudio) { try { ttsAudio.pause(); } catch (e) {} }
    ttsAudio = new Audio(url);
    try { ttsAudio.volume = speechVolume(); } catch (e) {}
    ttsAudio.onended = function(){ URL.revokeObjectURL(url); onDone(true); };
    ttsAudio.onerror = function(){ URL.revokeObjectURL(url); onDone(false); };
    var pr = ttsAudio.play();
    if (pr && pr.catch) pr.catch(function(){ URL.revokeObjectURL(url); onDone(false); });
  }).catch(function(){
    clearTimeout(timer);
    onDone(false);
  });
}

function pumpSpeech(){
  if (speaking || !speakQueue.length) return;
  var sp = speakQueue.shift();
  speaking = true;
  reportSpeech('start', sp.id);
    // 浏览器自带语音会触发 Windows「通信活动降音」，再叠一层压低就几乎听不见了
    duckSong();   // 不管服务端还是浏览器语音，说话时都压低音乐

  if (sp.tts) {
    playServerTts(sp, function(ok){
      if (ok) { speaking = false; if (!speakQueue.length) unduckSong(); reportSpeech('end', sp.id); pumpSpeech(); return; }
      // 服务端合成失败：退回浏览器语音，别让直播没声音
      speaking = false;
      speakWithBrowser(sp);
    });
    return;
  }

  speakWithBrowser(sp);
}

function speakWithBrowser(sp){
  speaking = true;
  try {
    if (!ttsVoices.length) loadVoices();
    var u = new SpeechSynthesisUtterance(sp.text);
    u.lang = 'zh-CN';
    u.rate = Math.min(2, Math.max(0.5, 1 + (Number(sp.rate) || 0) / 100));
    u.pitch = Math.min(2, Math.max(0, 1 + (Number(sp.pitch) || 0) / 50));
    u.volume = Math.min(1, Math.max(0, 1 + (Number(sp.volume) || 0) / 100)) * speechVolume();
    var byName = ttsVoices.filter(function (v) { return v.name === sp.voice; })[0];
    var zh = ttsVoices.filter(function (v) { return /^zh/i.test(v.lang); });
    u.voice = byName || zh[0] || ttsVoices[0] || null;
    u.onend = function(){ speaking = false; if (!speakQueue.length) unduckSong(); reportSpeech('end', sp.id); pumpSpeech(); };
    u.onerror = function(){ speaking = false; if (!speakQueue.length) unduckSong(); reportSpeech('end', sp.id); pumpSpeech(); };
    speechSynthesis.speak(u);
  } catch (e) {
    speaking = false;
    reportSpeech('end', sp.id);
  }
}

function speakOut(sp){
    if (MUTE) { if (sp && sp.id) reportSpeech('end', sp.id); return; }
  if (!sp || !sp.text) return;
  if (sp.enabled === false || sp.muted) {
    reportSpeech('end', sp.id);   // 静音也要放行，别把队列卡死
    return;
  }
  if (!sp.tts && !window.speechSynthesis) { reportSpeech('end', sp.id); return; }
  speakQueue.push(sp);
  pumpSpeech();
}

function speak(text, emotion){
  whoEl.textContent = '小汐';
  sayEl.textContent = text;
  capEl.classList.add('on');
  clearTimeout(capTimer);
  capTimer = setTimeout(function(){ capEl.classList.remove('on'); }, Math.max(6000, text.length * 320));

  setEmotion(emotion || '开心');

  figEl.classList.add('talking');
  clearTimeout(talkTimer);
  talkTimer = setTimeout(function(){ figEl.classList.remove('talking'); }, Math.max(1800, text.length * 260));
}

  // 歌放到一半卡住/没声：让服务端重解析地址，从当前位置续播
  var songRecovering = false;
  var songRecoverLast = 0;
  function recoverSong(reason) {
    if (songRecovering) return;
    if (Date.now() - songRecoverLast < 20000) return;
    if (!sg || !sg.currentSrc) return;
    songRecoverLast = Date.now();
    songRecovering = true;
    var at = Number(sg.currentTime || 0);
    fetch('/api/song/retry', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) return;
      var u = j.playing && j.playing.url;
      if (!u) return;
      // 期间如果换了歌，不要拿旧地址覆盖新歌
      if (j.playing && j.playing.name && sg.dataset.songName && j.playing.name !== sg.dataset.songName) return;
      curUrl = u;
      sg.src = u;
      sg.volume = SONG_VOL;
      try { sg.currentTime = Math.max(0, at - 1); } catch (e) {}
      var p = sg.play();
      if (p && p.catch) p.catch(function () {});
      console.log('[song] 重新取流：' + reason);
    }).catch(function () {}).then(function () { songRecovering = false; });
  }
  if (sg) {
    sg.addEventListener('stalled', function () { if (!sg.paused) recoverSong('stalled'); });
    sg.addEventListener('error', function () { recoverSong('error'); });
    setInterval(function () {
      if (!sg || sg.paused || !sg.currentSrc || sg.ended) return;
      if (sg.readyState < 3) recoverSong('readyState=' + sg.readyState);
    }, 8000);
  }


  // 每 5 秒回传播放器状态（诊断「放着放着没声」）
  setInterval(function () {
    if (!sg) return;
    try {
      fetch('/api/scene-audio', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          at: Date.now(),
          avVidReady: (function(){ var v=document.getElementById('petVid'); return v?v.readyState:null; })(),
          avVidW: (function(){ var v=document.getElementById('petVid'); return v?v.videoWidth:null; })(),
          avVidH: (function(){ var v=document.getElementById('petVid'); return v?v.videoHeight:null; })(),
          avVidSrc: (function(){ var v=document.getElementById('petVid'); return v?String(v.currentSrc||v.getAttribute('src')||'').slice(-60):''; })(),
          avVidErr: (function(){ var v=document.getElementById('petVid'); return v&&v.error?v.error.code:null; })(),
          obs: typeof IS_OBS !== 'undefined' ? IS_OBS : false,
          t: Number(sg.currentTime || 0),
          paused: sg.paused,
          ended: sg.ended,
          volume: sg.volume,
          readyState: sg.readyState,
          err: sg.error ? sg.error.code : null,
          vw: window.innerWidth,
          vh: window.innerHeight,
          dpr: window.devicePixelRatio || 1,
          scale: (function(){ var m = /scale\(([0-9.]+)\)/.exec(document.getElementById("stage").style.transform || ""); return m ? Number(m[1]) : null; })(),
          src: (sg.currentSrc || '').slice(0, 120),
          ducked: typeof songDucked !== 'undefined' ? songDucked : null,
          vidPlaying: Boolean(vidPlaying),
            muted: sg.muted,
            ctx: (viz && viz.audio) ? viz.audio.state : 'none',
            vidVol: vidEl ? vidEl.volume : null,
            vidMuted: vidEl ? vidEl.muted : null,
            vidReady: vidEl ? vidEl.readyState : null,
            vidW: vidEl ? vidEl.videoWidth : null,
            vidH: vidEl ? vidEl.videoHeight : null,
            vidSrc: vidEl ? String(vidEl.currentSrc || vidEl.getAttribute('src') || '').slice(-60) : '',
            avKind: (typeof AVATAR !== 'undefined' && AVATAR) ? AVATAR.kind : '',
            vidErr: vidEl && vidEl.error ? vidEl.error.code : null
        })
      }).catch(function () {});
    } catch (e) {}
  }, 5000);

  // ── 音乐可视化（只在放歌时出现，随机三种效果）──
  var VIZ_MODES = ['spectrum', 'ring', 'particles'];
  var viz = { on: true, mode: '', canvas: null, ctx: null, raf: 0, audio: null, analyser: null, data: null, last: 0, seed: 0 };
  var vizCfg = { enabled: true };

  function vizEnsure() {
    var stage = document.getElementById('stage');
    if (!stage) return null;
    if (!viz.canvas) {
      var c = document.createElement('canvas');
      c.width = 960; c.height = 540;
      c.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0;transition:opacity .4s';
      var bgDim = document.getElementById('bgDim');
      if (bgDim && bgDim.nextSibling) stage.insertBefore(c, bgDim.nextSibling);
      else stage.appendChild(c);
      viz.canvas = c;
      viz.ctx = c.getContext('2d');
    }
    return viz.canvas;
  }

  function vizAudio() {
    if (viz.audio) return viz.audio;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC || !sg) return null;
      // 跨域歌曲不能接进 WebAudio：没有 CORS 头时浏览器会把声音静音（"歌在放但没声"）
      var sameOrigin = false;
      try { sameOrigin = new URL(sg.currentSrc || sg.src, location.href).origin === location.origin; } catch (e) { sameOrigin = false; }
      if (!sameOrigin) return null;   // 跨域：不接分析器，用合成节拍，声音直接从 <audio> 出
      viz.audio = new AC();
      var src = viz.audio.createMediaElementSource(sg);
      var an = viz.audio.createAnalyser();
      an.fftSize = 256;
      an.smoothingTimeConstant = 0.82;
      src.connect(an);
      an.connect(viz.audio.destination);   // 必须接回去，否则点歌没声音
      viz.analyser = an;
      viz.data = new Uint8Array(an.frequencyBinCount);
      if (viz.audio.state === 'suspended') viz.audio.resume().catch(function () {});
    } catch (e) { viz.audio = null; return null; }
    return viz.audio;
  }

  function vizBars() {
    if (viz.barsEl) return viz.barsEl;
    var stage = document.getElementById('stage');
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:flex-end;gap:7px;padding:0 48px 0 48px;pointer-events:none;opacity:0;transition:opacity .35s;z-index:0';
    for (var i = 0; i < 48; i++) {
      var b = document.createElement('i');
      var t2 = i / 47;
      var col = 'rgba(' + Math.round(150 + 56 * t2) + ',' + Math.round(110 + 50 * t2) + ',255,';
      b.style.cssText = 'flex:1;height:4px;border-radius:4px 4px 0 0;transition:height 80ms linear;background:linear-gradient(to top,' + col + '.08),' + col + '.85))';
      wrap.appendChild(b);
    }
    var vid = document.getElementById('vidLayer');
    if (vid) stage.insertBefore(wrap, vid);
    else stage.appendChild(wrap);
    viz.barsEl = wrap;
    return wrap;
  }

  function vizPickMode() {
    viz.seed = Math.floor(Math.random() * 1000);
    viz.mode = VIZ_MODES[Math.floor(Math.random() * VIZ_MODES.length)];
  }

  function vizStop() {
    if (viz.raf) { cancelAnimationFrame(viz.raf); viz.raf = 0; }
    if (viz.canvas) { viz.canvas.style.opacity = '0'; if (viz.ctx) viz.ctx.clearRect(0, 0, 960, 540); }
    if (viz.barsEl) viz.barsEl.style.opacity = '0';
    viz.mode = '';
  }

  function vizStart() {
    if (!vizCfg.enabled) return;
    if (!sg || sg.paused || !sg.currentSrc) return;
    if (!vizPickModeIfNeeded()) return;
    vizEnsure();
    vizAudio();
    if (!viz.raf) viz.raf = requestAnimationFrame(vizFrame);
    if (viz.canvas) viz.canvas.style.opacity = '1';
    if (viz.audio && viz.audio.state === 'suspended') viz.audio.resume().catch(function () {});
  }

  function vizPickModeIfNeeded() {
    if (!viz.mode) vizPickMode();
    return true;
  }

  function vizFrame(ts) {
    viz.raf = requestAnimationFrame(vizFrame);
    if (!viz.canvas) return;
    if (!sg || sg.paused || !sg.currentSrc) { vizStop(); return; }
    if (ts && viz.last && ts - viz.last < 28) return;   // 约 30fps
    viz.last = ts || Date.now();
    var g = viz.ctx;
    if (!g) return;
    if (viz.canvas) viz.canvas.style.opacity = viz.mode === 'spectrum' ? '0' : '1';
    if (viz.barsEl) viz.barsEl.style.opacity = viz.mode === 'spectrum' ? '1' : '0';
    g.clearRect(0, 0, 960, 540);
    var an = viz.analyser;
    if (an && viz.data) an.getByteFrequencyData(viz.data);
    var d = viz.data || new Uint8Array(64);
    var n = d.length;
    // 低/中/高能量
    function band(a, b) { var s = 0, c = 0; for (var i = a; i < b && i < n; i++) { s += d[i]; c++; } return c ? s / c / 255 : 0; }
    var bass = band(1, 8), mid = band(10, 34), high = band(36, 90);
    // 有些环境拿不到音频数据（无声卡/分析器为 0），用合成节拍兜底，保证画面一直在动
    var avgE = 0;
    for (var q = 0; q < n; q++) avgE += d[q];
    avgE = n ? avgE / n / 255 : 0;
    var synth = avgE < 0.02;
    var spec;
    if (synth) {
      bass = 0.42 + 0.34 * Math.abs(Math.sin(t * 2.1));
      mid = 0.34 + 0.26 * Math.abs(Math.sin(t * 1.5 + 1.2));
      high = 0.28 + 0.24 * Math.abs(Math.sin(t * 2.9 + 2.1));
      spec = function (i2) { return Math.max(0.04, (Math.sin(t * 2.4 + i2 * 0.5) * 0.5 + 0.5) * (0.45 + 0.55 * Math.abs(Math.sin(t * 1.15 + i2 * 0.12)))); };
    } else {
      spec = function (i2) { return (d[i2] || 0) / 255; };
    }
    var t = (ts || Date.now()) / 1000;
    var stage = document.getElementById('stage');
    var W = 960, H = 540;

    try {  // viz draw
    if (viz.mode === 'spectrum') {
      var barsEl = vizBars();
      var kids = barsEl.children;
      for (var i = 0; i < kids.length; i++) {
        var idx = Math.floor(i / kids.length * 76) + 2;
        var v = Math.max(spec(idx) || 0, 0.12 + 0.62 * Math.abs(Math.sin(t * 2.3 + i * 0.47)));
        v = Math.min(1, Math.pow(v, 1.25) * (0.6 + (bass || 0) * 0.8));
        if (!isFinite(v)) v = 0.2;
        kids[i].style.height = (6 + v * 92) + "px";
      }
      barsEl.style.opacity = "1";
      if (viz.canvas) viz.canvas.style.opacity = "0";
    } else if (viz.mode === 'ring') {
      var pet = document.querySelector('.pet');
      var r = pet ? pet.getBoundingClientRect() : null;
      var sr = stage ? stage.getBoundingClientRect() : null;
      var cx = W / 2, cy = 330, rad = 250;
      if (r && sr) {
        var scale = sr.width / (stage.offsetWidth || 1920);
        cx = ((r.left + r.width / 2) - sr.left) / scale * (W / 1920);
        cy = ((r.top + r.height / 2) - sr.top) / scale * (H / 1080);
        rad = (r.width / scale) * (W / 1920) * 0.52;
      }
      var bars2 = 72;
      for (var k = 0; k < bars2; k++) {
        var a = (k / bars2) * Math.PI * 2 - Math.PI / 2;
        var idx2 = Math.floor((k / bars2) * 60) + 2;
        var v2 = Math.max(spec(idx2), 0.10 + 0.40 * Math.abs(Math.sin(t * 1.9 + idx2 * 0.41)));
        if (!isFinite(v2)) v2 = 0;
        var len = 4 + Math.pow(v2, 1.3) * 46 * (0.6 + bass * 0.8);
        if (!isFinite(len)) len = 6;
        var x1 = cx + Math.cos(a) * rad, y1 = cy + Math.sin(a) * rad;
        var x2 = cx + Math.cos(a) * (rad + len), y2 = cy + Math.sin(a) * (rad + len);
        g.strokeStyle = 'rgba(200,150,255,' + (0.35 + v2 * 0.6) + ')';
        g.lineWidth = 3.5;
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      }
    } else {
      // particles
      var count = 26;
      for (var p = 0; p < count; p++) {
        var sx = (p * 137.5 + viz.seed * 31) % W;
        var sp = 0.18 + ((p * 7) % 10) / 24 + bass * 0.8;
        var sy = H - ((t * 26 * sp + p * 53) % (H + 120));
        var rr = 1.2 + ((p * 13) % 7) / 4;
        var alpha = 0.18 + high * 0.55 + (Math.sin(t * 1.7 + p) * 0.5 + 0.5) * 0.25;
        g.beginPath(); g.arc(sx, sy, rr, 0, Math.PI * 2);
        g.fillStyle = 'rgba(214,178,255,' + Math.min(0.85, alpha) + ')';
        g.fill();
      }
      // 背景轻微脉动
      g.fillStyle = 'rgba(140,100,230,' + (0.03 + mid * 0.07) + ')';
      g.fillRect(0, 0, W, H);
    }
    } catch (e) { /* 绘制异常不中断循环 */ }
  }

  // ── 事件渲染 ──
  // ── 视频（B站点播）──
  var vidLayer = document.getElementById('vidLayer');
  var vidEl = document.getElementById('vid');
  var vidPlaying = null;
  var vidForVod = false;   // true=当前元素在放 B 站视频，false=可能在放形象视频
  function videoMode(on) {
    document.getElementById('stage').classList.toggle('video', !!on);
  }
  var songFrozenForVideo = false;

  // 事件可能乱序：每秒校正一次，视频在放就一定把歌停掉
  function enforceMutex() {
    if (vidPlaying && sg && !sg.paused) { try { sg.pause(); } catch (e) {} songFrozenForVideo = true; }
  }
  setInterval(enforceMutex, 1000);

  // 看门狗：保证放歌时一定在动，停歌/暂停时一定停
  // 声音自检：播 1.2 秒 440Hz，用来确认系统/直播伴侣是否收到声音
  function playTestTone() {
    window.__tone = (window.__tone || 0) + 1;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (viz && !viz.audio) viz.audio = new AC();
      var ctx2 = (viz && viz.audio) ? viz.audio : new AC();
      if (ctx2.state === 'suspended') ctx2.resume();
      var osc = ctx2.createOscillator();
      var gain = ctx2.createGain();
      osc.type = 'sine';
      osc.frequency.value = 440;
      gain.gain.setValueAtTime(0.0001, ctx2.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.22, ctx2.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx2.currentTime + 1.15);
      osc.connect(gain);
      gain.connect(ctx2.destination);
      osc.start();
      osc.stop(ctx2.currentTime + 1.2);
    } catch (e) { /* ignore */ }
  }

  var vizWatch = setInterval(function () {
    try {
    if (viz.audio && viz.audio.state !== 'running') { try { viz.audio.resume(); } catch (e) {} }
      if (!vizCfg.enabled) { if (viz.raf) vizStop(); return; }
      var playing = sg && !sg.paused && sg.currentSrc;
      if (playing && !viz.raf) vizStart();
      else if (!playing && viz.raf) vizStop();
    } catch (e) { /* ignore */ }
  }, 1200);

  function pauseSongForVideo() {
    if (sg && !sg.paused && sg.currentSrc) {
  // ── 音频卡顿自愈 ──
  var audioWatch = { songT: -1, songTry: 0, vidT: -1, vidTry: 0 };
  setInterval(function () {
    try {
      if (sg && !sg.paused && sg.currentSrc) {
        var t = sg.currentTime;
        if (Math.abs(t - audioWatch.songT) < 0.15 && sg.readyState < 3) {
          audioWatch.songTry++;
          if (audioWatch.songTry >= 2) {
            audioWatch.songTry = 0;
            try { sg.load(); sg.play(); } catch (e) {}
          }
        } else audioWatch.songTry = 0;
        audioWatch.songT = t;
      }
      var vEl = document.getElementById('vid');
      if (vEl && !vEl.paused && vEl.currentSrc && vEl.readyState < 3) {
        var vt = vEl.currentTime;
        if (Math.abs(vt - audioWatch.vidT) < 0.15) {
          audioWatch.vidTry++;
          if (audioWatch.vidTry >= 2) {
            audioWatch.vidTry = 0;
            try { vEl.load(); vEl.play(); } catch (e) {}
          }
        } else audioWatch.vidTry = 0;
        audioWatch.vidT = vt;
      }
    } catch (e) { /* ignore */ }
  }, 5000);

      try { sg.pause(); songFrozenForVideo = true; } catch (e) {}
    }
  }

  function resumeSongAfterVideo() {
    if (!songFrozenForVideo) return;
    songFrozenForVideo = false;
    if (sg && sg.currentSrc) { try { sg.play().catch(function () {}); } catch (e) {} }
  }

  function playVideo(d) {
    if (!d || !d.url) return;
    pauseSongForVideo();
    vidPlaying = d;
    document.getElementById('vidTitle').textContent = d.title || '';
    document.getElementById('vidBy').textContent = d.owner ? ('@' + d.owner) : '';
    vidForVod = true;
    vidEl.src = d.url;
    try { vidEl.muted = false; vidEl.volume = 1; } catch (e) {}
    vidEl.currentTime = 0;
    var p = vidEl.play();
    if (p && p.catch) p.catch(function () { /* 自动播放被拦，等用户交互 */ });
    vidLayer.classList.add('on');
    videoMode(true);
  }
  function stopVideo() {
    vidPlaying = null;
    resumeSongAfterVideo();
  if (vidForVod) {
    vidForVod = false;
    try { vidEl.pause(); } catch (e) {}
    vidEl.removeAttribute('src');
    vidEl.load();
    if (AVATAR && AVATAR.kind === 'video' && AVATAR.video) applyAvatar(AVATAR);
  }
    vidLayer.classList.remove('on');
    videoMode(false);
  }
  function reportEnded() {
    var bv = vidPlaying && vidPlaying.bvid;
    stopVideo();
    try {
      fetch('/api/video/ended', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ bvid: bv || '' })
      });
    } catch (e) {}
  }
  vidEl.addEventListener('ended', reportEnded);
  vidEl.addEventListener('error', function () {
    // 放不出来也算结束 → 服务端自动下一条
    if (vidPlaying) reportEnded();
  });

  // 刷新/重开 OBS 后恢复正在播的视频
  fetch('/api/video/state').then(function (r) { return r.json(); }).then(function (s) {
    if (s && s.playing && (s.playing.url || s.playing.file)) {
      playVideo({ url: s.playing.url || ('/media/' + s.playing.file + '?v=' + Date.now()), title: s.playing.title, owner: s.playing.owner, bvid: s.playing.bvid });
    }
  }).catch(function () {});

  var spokenAt = {};
  var lastSeenAt = 0;
  function alreadySpoken(at) {
    if (!at) return false;
    var now = Date.now();
    if (spokenAt[at]) return true;
    spokenAt[at] = now;
    Object.keys(spokenAt).forEach(function (k) { if (now - spokenAt[k] > 120000) delete spokenAt[k]; });
    return false;
  }

  // ── 弹幕赛马渲染 ──
  var GCOLORS = { 1: "#ff6b6b", 2: "#5aa9ff", 3: "#ffd166" };
  function gameBuild(s) {
    var box = document.getElementById("gTrack");
    if (!box || box.dataset.built) return;
    box.dataset.built = "1";
    (s.horses || []).forEach(function (h) {
      var d = document.createElement("div"); d.className = "g-lane"; d.dataset.lane = h.lane;
      d.innerHTML = "<span class=\"g-name\">" + h.name + "</span><div class=\"g-run\"><div class=\"g-fill\"></div><i>🐎</i></div>";
      box.appendChild(d);
    });
  }
  function gameRender(s) {
    if (!s || !s.horses) return;
    var layer = document.getElementById("gameLayer"), stage = document.getElementById("stage");
    gameBuild(s);
    if (layer) layer.classList.add("on");
    if (stage) stage.classList.add("game");
    (s.horses || []).forEach(function (h) {
      var lane = document.querySelector(".g-lane[data-lane=\"" + h.lane + "\"]");
      if (!lane) return;
      var fill = lane.querySelector(".g-fill"), horse = lane.querySelector("i");
      var p = Math.max(0, Math.min(100, Number(h.progress) || 0));
      if (fill) { fill.style.width = p + "%"; fill.style.background = GCOLORS[h.lane] || "#fff"; }
      if (horse) horse.style.left = p + "%";
    });
    var tm = document.getElementById("gTimer");
    if (tm) tm.textContent = s.active ? Math.max(0, Math.ceil((s.endsAt - Date.now()) / 1000)) : (s.winner ? "结束" : "0");
    var win = document.getElementById("gWin");
    if (win) win.textContent = s.winner ? (s.winner.name + " 赢啦！") : "";
  }
  function gameHide() {
    var layer = document.getElementById("gameLayer"), stage = document.getElementById("stage");
    if (layer) layer.classList.remove("on");
    if (stage) stage.classList.remove("game");
  }
  function onGame(d) {
    if (!d) return;
    if (d.action === "stop") { gameHide(); return; }
    gameRender(d);
    if (d.action === "end") { setTimeout(function () { if (!document.getElementById("gameLayer").classList.contains("on")) return; setTimeout(gameHide, 9000); }, 0); }
  }
  function handle(d, replay){
    // 断线重连会重发最近 20 条（backlog），已经显示过的不再重复上屏
    if (d && d.at) {
      var stateKinds = { config: 1, song: 1, 'video-state': 1, stats: 1 };
      if (replay && !stateKinds[d.kind] && d.at <= lastSeenAt) return;
      if (d.at > lastSeenAt) lastSeenAt = d.at;
    }
  if (d.kind === 'role') {
    if (d.speaker === false) MUTE = true;
    return;
  }
  if (d.kind === 'soundtest') { playTestTone(); return; }
  if (d.kind === 'chat') {
    addLine('', d.user, d.text);
  } else if (d.kind === 'gift') {
    addLine('gift', d.user, '送出 ' + d.text);
  } else if (d.kind === 'enter') {
    // 只显示通过服务端节流的进场，否则热门直播间会被进场消息刷屏
    if (d.welcome && !replay) {
      addLine('enter', d.user, '进入直播间');
      welcome(d.user);
    }
  } else if (d.kind === 'config') {
    var C0 = d.config || {};
    if (C0.avatar) applyAvatar(C0.avatar);
    var S0 = C0.scene || {};
    if (S0.layout) { layoutMode = S0.layout; fit(); }
    if (S0.bg) applyBg(S0.bg);
    if (S0.viz) { vizCfg.enabled = S0.viz.enabled !== false; if (!vizCfg.enabled) vizStop(); }
      if (S0.dj) { djEnabled = S0.dj.enabled !== false; djShow(songPlaying); }
  } else if (d.kind === 'song-note') {
    showNotice(d.text, d.ok);
  } else if (d.kind === 'song') {
    setSong(d);
  } else if (d.kind === 'backlog') {
    // 刚连上时补发最近的消息，OBS 重启 / 刷新不会一片空白
    (d.items || []).forEach(function(it){ handle(it, true); });
  } else if (d.kind === 'game') { onGame(d);
    } else if (d.kind === 'video') {
      if (!replay) {
        if (d.action === 'play') playVideo(d);
        else if (d.action === 'stop') stopVideo();
      }
    } else if (d.kind === 'video-state') {
      if (!d.playing) stopVideo();
      else if (!vidPlaying) playVideo({ url: d.playing.url || ('/media/' + d.playing.file + '?v=' + Date.now()), title: d.playing.title, owner: d.playing.owner, bvid: d.playing.bvid });
    } else if (d.kind === 'reply') {
      addLine('me', '[我]', d.text);
      if (replay) return;                       // 回放旧消息：不出声，避免重复说话
      if (alreadySpoken(d.at)) return;          // 同一条只念一次
      speak(d.text, d.emotion);
      if (d.speech) speakOut(d.speech);
  } else if (d.kind === 'stats') {
    setTxt('online', Number(d.online).toLocaleString());
    setTxt('recv', d.received);
    setTxt('rep', d.replied);
    setTxt('drop', d.dropped);
  }
}

// ── 演示模式：不连服务，本地造几条，用来截图/预览 ──
function demoMode(){
  badge.classList.remove('off');
  var seed = [
    ['enter', '小鱼干', ''],
    ['chat', '夜猫子', '主播今天播到几点'],
    ['chat', '阿康', '这个模型好可爱'],
    ['gift', '老张', '玫瑰'],
    ['reply', '[我]', '播到十二点哦，别熬太晚']
  ];
  seed.forEach(function(s, i){
    setTimeout(function(){
      if (s[0] === 'enter') handle({ kind: 'enter', user: s[1], welcome: true });
      else if (s[0] === 'gift') handle({ kind: 'gift', user: s[1], text: s[2] });
      else handle({ kind: s[0], user: s[1], text: s[2], emotion: '开心' });
    }, i * 220);
  });
  setTimeout(function(){ handle({ kind: 'chat', user: 'momo', text: '声音好好听' }); }, 1500);
  setTimeout(function(){
    handle({ kind: 'song',
      playing: { name: '半点心', user: '阿康', at: Date.now() },
      queue: [{ name: '起风了', user: 'momo' }, { name: '稻香', user: '小鱼干' }] });
  }, 1300);
  setTimeout(function(){ handle({ kind: 'stats', online: 1284, received: 12, replied: 3, dropped: 2 }); }, 1600);
}

// ── SSE ──
var es = null;
function connect(){
  es = new EventSource('/events');
  es.onopen = function(){ badge.classList.remove('off'); badge.innerHTML = '<span class="dot"></span>AI 主播'; };
  es.onerror = function(){ badge.classList.add('off'); badge.innerHTML = '<span class="dot"></span>画面已断开'; };
  es.onmessage = function(e){
    var d;
    try { d = JSON.parse(e.data); } catch { return; }
    handle(d);
  };
  // 断线自愈：EventSource 自带重连，这里只做状态提示
  setInterval(function(){
    if (es.readyState === 2) { badge.classList.add('off'); badge.innerHTML = '<span class="dot"></span>画面已断开'; }
  }, 3000);
}

if (location.search.indexOf('demo') >= 0) demoMode();
else connect();
</script>
